name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '36 5 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      if: ${{ matrix.language == 'python' }}
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      if: ${{ matrix.language == 'python' }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install types-all

    - name: Setup Node
      if: ${{ matrix.language == 'javascript' }}
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install JavaScript dependencies
      if: ${{ matrix.language == 'javascript' }}
      run: |
        npm ci
        npm install -g typescript@latest

    # Initialize CodeQL for scanning
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}
        config-file: .github/codeql/codeql-config.yml
        setup-python-dependencies: true
        ram: 6144
        # Add queries based on language
        queries: |
          ${{ matrix.language == 'python' && '+security-extended,security-and-quality' || '' }}
          ${{ matrix.language == 'javascript' && '+security-extended,security-and-quality,security-experimental' || '' }}

    # Autobuild attempts to build any compiled languages
    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    # Run analysis with enhanced settings
    - name: Analyze
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:${{ matrix.language }}"
        output: sarif-results/${{ matrix.language }}.sarif
        ram: 6144

    # Upload SARIF file
    - name: Upload SARIF results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: sarif-results/${{ matrix.language }}.sarif
        category: "/language:${{ matrix.language }}"

    # Optional: Enhanced test coverage and linting for JavaScript
    - name: Run ESLint
      if: matrix.language == 'javascript'
      run: |
        npm run lint

    # Optional: Generate test coverage for Python code
    - name: Generate test coverage
      if: matrix.language == 'python'
      run: |
        pip install coverage
        python -m coverage run -m pytest
        python -m coverage xml

    - name: Upload coverage to Codecov
      if: matrix.language == 'python'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: ${{ matrix.language }}
        fail_ci_if_error: true
