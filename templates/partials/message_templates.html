<!-- User Message Template -->
<template id="user-message-template">
    <div class="user-message flex items-start gap-4 p-4">
        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-secondary-600 dark:bg-secondary-500 flex items-center justify-center">
            <i class="fas fa-user text-white text-sm"></i>
        </div>
        <div class="flex-1 min-w-0">
            <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm border border-gray-200 dark:border-gray-700">
                <p class="prose dark:prose-invert max-w-none"></p>
                <div class="mt-3 flex items-center justify-between">
                    <span class="text-xs text-gray-500 dark:text-gray-400"></span>
                    <button class="copy-button p-2 -m-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" aria-label="Copy message">
                        <i class="fas fa-copy text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- Assistant Message Template -->
<template id="assistant-message-template">
    <div class="message-container assistant flex items-start gap-4 p-4">
        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-primary-600 dark:bg-primary-500 flex items-center justify-center">
            <i class="fas fa-robot text-white text-sm"></i>
        </div>
        <div class="message-content flex-1 min-w-0">
            <div data-role="assistant-message" class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm border border-gray-200 dark:border-gray-700">
                <div class="prose dark:prose-invert max-w-none"></div>
                <div class="mt-3 flex items-center justify-between">
                    <span class="text-xs text-gray-500 dark:text-gray-400"></span>
                    <div class="flex items-center">
                        <button class="regenerate-button p-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" aria-label="Regenerate response">
                            <i class="fas fa-redo text-lg"></i>
                        </button>
                        <button class="copy-button p-2 ml-1 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" aria-label="Copy message">
                            <i class="fas fa-copy text-lg"></i>
                        </button>
                    </div>
                </div>
                <button class="toggle-more hidden mt-4 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors min-h-[44px] w-full sm:w-auto">
                    Show more
                </button>
            </div>
        </div>
    </div>
</template>

<!-- Typing Indicator Template -->
<template id="typing-indicator-template">
    <div class="message-container assistant flex items-start gap-4 p-4">
        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-primary-600 dark:bg-primary-500 flex items-center justify-center">
            <i class="fas fa-robot text-white text-sm"></i>
        </div>
        <div class="flex-1 min-w-0">
            <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm border border-gray-200 dark:border-gray-700">
                <div class="flex gap-2">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- File Attachment Templates -->
<template id="attachment-template">
    <div class="mt-2">
        <div class="attachment-list space-y-2"></div>
    </div>
</template>

<template id="attachment-item-template">
    <div class="bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 p-3">
        <div class="flex items-start gap-3">
            <!-- File Icon/Preview -->
            <div class="file-preview w-10 h-10 flex-shrink-0 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center">
                <i class="fas fa-file text-gray-400 dark:text-gray-500 text-xl file-icon"></i>
                <img class="w-full h-full object-cover rounded-lg hidden preview-image" alt="">
            </div>
            
            <!-- File Info -->
            <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2">
                    <div class="flex-1 min-w-0">
                        <a class="attachment-link block text-sm font-medium text-blue-600 dark:text-blue-400 hover:underline truncate" target="_blank">
                            <span class="attachment-name"></span>
                        </a>
                        <div class="flex items-center gap-2 mt-1 text-xs text-gray-500 dark:text-gray-400">
                            <span class="file-size"></span>
                            <span class="file-type"></span>
                            <span class="file-date"></span>
                        </div>
                    </div>
                    
                    <!-- Actions -->
                    <div class="flex items-center gap-1">
                        <button class="preview-button p-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" aria-label="Preview file">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="remove-button p-2 text-gray-500 dark:text-gray-400 hover:text-red-600 dark:hover:text-red-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" aria-label="Remove file">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- Error Message Template -->
<template id="error-message-template">
    <div class="error-message bg-red-100 dark:bg-red-900/30 text-red-800 dark:text-red-200 p-4 rounded-lg my-2">
        <div class="flex items-center gap-2">
            <i class="fas fa-exclamation-circle"></i>
            <span class="error-text"></span>
        </div>
    </div>
</template>

<!-- System Message Template -->
<template id="system-message-template">
    <div class="system-message flex items-start gap-4 p-4">
        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-gray-600 dark:bg-gray-500 flex items-center justify-center">
            <i class="fas fa-cog text-white text-sm"></i>
        </div>
        <div class="flex-1 min-w-0">
            <div class="bg-gray-100 dark:bg-gray-800/50 rounded-lg p-4 shadow-sm border border-gray-200/50 dark:border-gray-700/50">
                <p class="prose dark:prose-invert max-w-none italic text-gray-600 dark:text-gray-300"></p>
            </div>
        </div>
    </div>
</template>

<!-- Code Block Template -->
<template id="code-block-template">
    <div class="code-block-wrapper relative">
        <pre><code></code></pre>
        <button class="copy-code absolute top-2 right-2 p-2 min-h-[44px] min-w-[44px] flex items-center justify-center bg-gray-800/10 dark:bg-gray-200/10 rounded-lg hover:bg-gray-800/20 dark:hover:bg-gray-200/20 transition-colors" aria-label="Copy code">
            <i class="fas fa-copy text-lg"></i>
        </button>
    </div>
</template>

<!-- File Upload Progress Template -->
<template id="upload-progress-template">
    <div class="upload-progress bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm border border-gray-200 dark:border-gray-700 mt-2">
        <div class="flex items-center justify-between mb-2">
            <span class="filename text-sm font-medium"></span>
            <span class="percentage text-sm text-gray-500 dark:text-gray-400"></span>
        </div>
        <div class="h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
            <div class="progress-bar h-full bg-blue-600 dark:bg-blue-500 transition-all duration-300"></div>
        </div>
    </div>
</template>
