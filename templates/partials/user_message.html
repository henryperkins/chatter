<div class="message-container user-message">
    <div class="flex gap-3 w-full justify-end">
        <div class="flex-1 relative">
            <div class="message-bubble">
                <p class="text-[15px] leading-relaxed break-words whitespace-pre-wrap">
                    {{ message.content }}
                </p>
                {% if message.metadata and message.metadata.has_attachments %}
                <div class="mt-2 pt-2 border-t border-white/20">
                    <div class="text-sm font-medium">Attachments:</div>
                    {% for attachment in message.metadata.attachments %}
                    <div class="mt-1 flex items-center gap-2 bg-white/10 rounded-lg p-2">
                        <i class="fas fa-paperclip"></i>
                        <span class="flex-1 truncate">{{ attachment.name }}</span>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
            </div>
            <span class="text-xs text-gray-500 dark:text-gray-400 block mt-1 text-right">
                {{ message.timestamp }}
            </span>
        </div>
        <div class="flex-shrink-0 h-8 w-8 rounded-full bg-primary-600/20 shadow-sm"></div>
    </div>
</div>
