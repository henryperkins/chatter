<div class="message-container assistant-message">
    <div class="flex gap-3 w-full">
        <div class="flex-shrink-0 h-8 w-8 rounded-full bg-gradient-to-br from-primary-500 to-secondary-600 flex items-center justify-center text-white shadow-md" role="img" aria-label="Assistant avatar">
            <i class="fas fa-robot text-sm"></i>
        </div>
        <div class="flex-1 relative group">
            <div class="absolute right-3 top-3 flex items-center gap-2 z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                <button class="copy-button btn-icon" title="Copy to clipboard" data-raw-content="{{ message.raw_content|default(message.content)|e }}">
                    <i class="fas fa-copy"></i>
                </button>
            </div>

            <div class="message-bubble">
                <div class="message-content" data-role="assistant-message">
                    <div class="prose dark:prose-invert prose-sm sm:prose-base max-w-none" data-content="{{ message.content|e }}">
                        {{ message.content|safe }}
                    </div>
                    <button class="toggle-more hidden">Show more</button>
                </div>

                {% if message.metadata and message.metadata.has_attachments %}
                <div class="mt-4 space-y-2">
                    <div class="text-sm font-medium text-gray-700 dark:text-gray-300">Attached Files:</div>
                    {% for attachment in message.metadata.attachments %}
                    <div class="flex items-center gap-2 bg-gray-50/90 dark:bg-gray-700/50 rounded-xl p-3">
                        <i class="fas fa-file-alt text-primary-500"></i>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-medium truncate">{{ attachment.name }}</div>
                            <div class="text-xs text-gray-500 dark:text-gray-400">Click to expand</div>
                        </div>
                        <button class="toggle-file-content btn-icon" data-file-name="{{ attachment.name }}" title="Toggle file content">
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </div>
                    <div class="file-content hidden ml-6 mt-2 bg-gray-100/90 dark:bg-gray-800/90 rounded-xl p-3">
                        <pre class="text-sm text-gray-800 dark:text-gray-200 whitespace-pre-wrap">{{ attachment.content }}</pre>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
            </div>
            <span class="text-xs text-gray-500 dark:text-gray-400 block mt-1">
                {{ message.timestamp }}
            </span>
        </div>
    </div>
</div>
