<div id="token-usage" class="flex items-center justify-between gap-2">
    <!-- Usage Stats -->
    <div class="flex items-center gap-2 text-sm">
        <span id="tokens-used" class="font-medium tabular-nums" role="status" aria-live="polite">0</span>
        <span class="text-gray-500 dark:text-gray-400">/</span>
        <span id="tokens-limit" class="text-gray-500 dark:text-gray-400 tabular-nums">0</span>
        <span id="token-percentage" class="font-medium text-gray-700 dark:text-gray-300 tabular-nums">0%</span>
        <span id="tokens-left" class="text-sm text-gray-500 dark:text-gray-400"></span>
    </div>
    
    <!-- Distribution -->
    <div class="flex items-center gap-3 text-sm tabular-nums">
        <div class="flex items-center gap-1.5">
            <i class="fas fa-user text-primary-500 text-xs"></i><span id="user-tokens">0</span>
        </div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-robot text-secondary-500 text-xs"></i><span id="assistant-tokens">0</span>
        </div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-cog text-purple-500 text-xs"></i><span id="system-tokens">0</span>
        </div>
    </div>
</div>
