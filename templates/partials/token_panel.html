<div class="flex flex-col space-y-3">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-white/50 dark:bg-gray-800/50 px-4 py-2 rounded-xl">
                <span id="tokens-used" class="text-sm font-medium" role="status" aria-live="polite">0</span>
                <span id="tokens-limit" class="text-sm text-gray-500 dark:text-gray-400">/ 0 max</span>
            </div>
            <span id="tokens-left" class="text-sm text-gray-500 dark:text-gray-400 bg-white/50 dark:bg-gray-800/50 px-4 py-2 rounded-xl">
                (0 remaining)
            </span>
        </div>
        <div class="flex items-center gap-3">
            <span id="token-percentage" class="text-sm font-medium bg-white/50 dark:bg-gray-800/50 px-4 py-2 rounded-xl">
                0%
            </span>
            <button id="toggle-stats-btn" class="btn-icon" title="Toggle token usage statistics">
                <i class="fas fa-chart-pie"></i>
            </button>
        </div>
    </div>

    <div class="w-full bg-gray-200/90 dark:bg-gray-700/90 rounded-xl h-2 overflow-hidden">
        <div id="token-progress" class="bg-gradient-to-r from-primary-500 to-secondary-500 h-full rounded-xl transition-all duration-300" style="width: 0%">
        </div>
    </div>

    <div id="token-breakdown" class="bg-gray-50/90 dark:bg-gray-700/50 rounded-xl p-4">
        <div class="flex justify-between items-center mb-3">
            <span class="font-medium text-gray-700 dark:text-gray-300">Token Distribution</span>
            <span id="avg-tokens" class="text-xs text-gray-500 dark:text-gray-400">Avg: 0 per message</span>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div class="token-stat-card">
                <div class="flex items-center gap-2">
                    <i class="fas fa-user text-primary-500"></i>
                    <span class="font-medium">User</span>
                </div>
                <span id="user-tokens" class="mt-2">0</span>
            </div>
            <div class="token-stat-card">
                <div class="flex items-center gap-2">
                    <i class="fas fa-robot text-secondary-500"></i>
                    <span class="font-medium">Assistant</span>
                </div>
                <span id="assistant-tokens" class="mt-2">0</span>
            </div>
            <div class="token-stat-card">
                <div class="flex items-center gap-2">
                    <i class="fas fa-cog text-purple-500"></i>
                    <span class="font-medium">System</span>
                </div>
                <span id="system-tokens" class="mt-2">0</span>
            </div>
        </div>

        <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-200 dark:border-gray-600">
            <span id="message-count" class="text-xs text-gray-500 dark:text-gray-400">Messages: 0</span>
            <span id="largest-message" class="text-xs text-gray-500 dark:text-gray-400">Largest: 0 tokens</span>
        </div>
    </div>
</div>
